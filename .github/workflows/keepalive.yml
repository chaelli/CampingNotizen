name: Supabase Keepalive

# Hält das Supabase-Projekt aktiv: Bei der Gratis-Stufe wird ein Projekt nach
# ~7 Tagen ohne DATENBANK-Aktivität pausiert. Laut Supabase genügen "ein paar
# Anfragen pro Tag" - ein einzelner Lese-Request pro Tag war offenbar zu wenig
# (es kam trotzdem eine Warn-Mail). Darum jetzt:
#   - 4x taeglich statt 1x
#   - pro Lauf ein LESE- und ein SCHREIB-Vorgang (Schreiben zaehlt eindeutig)
#
# Der Schreibvorgang ist ein Upsert auf EINE feste Zeile mit board
# '__keepalive__'. Diese Zeile ist in der App unsichtbar, weil die App immer
# nach board = <SHA-256 des Zugangscodes> filtert (und '__keepalive__' ist kein
# gueltiger Hash). Es wird nichts geloescht - dadurch kann der Workflow
# grundsaetzlich keine echten Daten beschaedigen.
#
# Hinweis: Geplante (cron) Workflows laufen bei GitHub nur vom DEFAULT-Branch
# und werden nach 60 Tagen ohne Repo-Aktivitaet deaktiviert - dagegen laeuft
# repo-activity.yml.

on:
  schedule:
    # Alle 6 Stunden (04:17, 10:17, 16:17, 22:17 UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Feste Kennung der Keepalive-Zeile (kein gueltiger SHA-256 -> keine Kollision
# mit einem echten Platz).
env:
  KEEPALIVE_BOARD: __keepalive__
  KEEPALIVE_ID: 00000000-0000-4000-8000-000000000001

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase anpingen (lesen + schreiben)
        run: |
          set -euo pipefail

          # URL + oeffentlicher anon-Key aus der App-Konfiguration lesen,
          # damit es nur eine Quelle der Wahrheit gibt.
          URL=$(node -e "const s=require('fs').readFileSync('src/supabaseConfig.ts','utf8');process.stdout.write(s.match(/url:\s*'([^']+)'/)[1])")
          KEY=$(node -e "const s=require('fs').readFileSync('src/supabaseConfig.ts','utf8');process.stdout.write(s.match(/anonKey:\s*'([^']+)'/)[1])")

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Supabase-URL oder anon-Key konnte nicht aus src/supabaseConfig.ts gelesen werden."
            exit 1
          fi

          # --- 1) Lesen -------------------------------------------------------
          echo "1) Lesen: caravans (1 Zeile)"
          READ_CODE=$(curl -sS -o /tmp/read.json -w '%{http_code}' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Accept: application/json" \
            "$URL/rest/v1/caravans?select=id&limit=1")
          echo "   HTTP $READ_CODE"

          if [ "$READ_CODE" != "200" ]; then
            echo "::error::Lese-Request fehlgeschlagen (HTTP $READ_CODE):"
            head -c 400 /tmp/read.json || true
            exit 1
          fi

          # --- 2) Schreiben (Upsert einer festen Zeile) -----------------------
          # Kein DELETE, kein Wachstum: dieselbe Zeile wird immer neu geschrieben.
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "2) Schreiben: Upsert Keepalive-Zeile ($NOW)"

          BODY=$(node -e "
            const o = {
              id: process.env.KEEPALIVE_ID,
              board: process.env.KEEPALIVE_BOARD,
              label: 'keepalive ' + process.argv[1],
              lat: 0,
              lng: 0
            };
            process.stdout.write(JSON.stringify(o));
          " "$NOW")

          WRITE_CODE=$(curl -sS -o /tmp/write.json -w '%{http_code}' \
            -X POST \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$BODY" \
            "$URL/rest/v1/caravans")
          echo "   HTTP $WRITE_CODE"

          case "$WRITE_CODE" in
            200|201|204)
              echo "   Schreibvorgang ok."
              ;;
            *)
              echo "::error::Schreib-Request fehlgeschlagen (HTTP $WRITE_CODE):"
              head -c 400 /tmp/write.json || true
              exit 1
              ;;
          esac

          echo "Supabase ist erreichbar, Lese- UND Schreibaktivitaet erzeugt."
